[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dvr-cowork"
version = "1.0.0"
description = "DaVinci Resolve co-worker tools: voiceover sync, frame review, project info"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1,<2",
    "av>=12,<20",
    "numpy>=1.24",
    "Pillow>=10.0",
    "fastembed>=0.9,<0.10",     # multilingual-e5-small: memory gateway search + plan semantic tie-break
    "sqlite-vec>=0.1.9,<0.2",   # vector table in .work/memory/knowledge.db
    "psycopg[binary]>=3.2,<4",  # .work/tools/library_db.py: Postgres mirror of the footage library
    "google-api-python-client>=2.100,<3",  # dvr_cowork.youtube / seo: upload + trend search
    "google-auth-oauthlib>=1.2,<2",        # YouTube OAuth login
    "keyring>=25,<26",                     # Gemini API key in Windows Credential Manager
    "scipy>=1.11",                         # hide-logo minimax_worker.py (mask dilation / fill)
]

[project.scripts]
dvr = "dvr_cowork.cli:main"

[tool.setuptools]
packages = ["dvr_cowork", "dvr_cowork.fullai"]

[tool.setuptools.package-data]
"dvr_cowork.fullai" = ["config.toml"]
