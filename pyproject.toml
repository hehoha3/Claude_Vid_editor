[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dvr-cowork"
version = "1.0.0"
description = "DaVinci Resolve co-worker tools: voiceover sync, frame review, project info"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1,<2",
    "av>=12,<20",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
dvr = "dvr_cowork.cli:main"

[tool.setuptools]
packages = ["dvr_cowork"]
